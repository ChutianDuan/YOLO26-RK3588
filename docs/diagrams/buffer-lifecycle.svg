<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1420" viewBox="0 0 1640 1420" role="img" aria-labelledby="title desc">
<title id="title">02 · 一帧图像的缓冲与归还条件</title><desc id="desc">当前 MPP MJPEG 链路 · P / S / I / B / E 是独立内存角色；箭头表示读取与转换，不表示原地改写</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9Z" fill="#536f85"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans CJK JP",sans-serif;fill:#152b40}.small{font-size:19px;fill:#52677a}.body{font-size:21px}.label{font-size:18px;fill:#52677a}.title{font-size:26px;font-weight:700}</style>
<rect width="1640" height="1420" fill="#fbfcfe"/>
<rect x="0" y="0" width="1640" height="9" fill="#2e6f85"/>
<text x="56" y="64" font-size="35" font-weight="700" fill="#152b40" text-anchor="start">02 · 一帧图像的缓冲与归还条件</text>
<text x="56" y="105" font-size="20" font-weight="400" fill="#52677a" text-anchor="start">当前 MPP MJPEG 链路 · P / S / I / B / E 是独立内存角色；箭头表示读取与转换，不表示原地改写</text>
<rect x="60" y="165" width="300" height="145" rx="14" fill="#eaf6f0" stroke="#40876b" stroke-width="1.6"/>
<text x="81" y="203" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">V4L2 DMA-BUF 槽</text>
<text x="81" y="240" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">摄像头写压缩帧</text>
<text x="81" y="269" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">DQBUF 后换入空闲 P</text>
<rect x="435" y="165" width="300" height="145" rx="14" fill="#eaf6f0" stroke="#40876b" stroke-width="1.6"/>
<text x="456" y="203" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">P · MJPEG 包池 ×8</text>
<text x="456" y="240" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">换入空闲缓冲便 QBUF</text>
<text x="456" y="269" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">P 仍由解码线程持有</text>
<rect x="810" y="165" width="300" height="145" rx="14" fill="#edf4ff" stroke="#5585bd" stroke-width="1.6"/>
<text x="831" y="203" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">MPP 解码</text>
<text x="831" y="240" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">提交 P；写入 S</text>
<text x="831" y="269" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">确认完成后归还 P</text>
<rect x="1185" y="165" width="355" height="145" rx="14" fill="#eaf6f0" stroke="#40876b" stroke-width="1.6"/>
<text x="1206" y="203" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">S · NV12 Surface ×8</text>
<text x="1206" y="240" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">800×600 可见图像</text>
<text x="1206" y="269" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">检查 stride / PTS / 容量</text>
<path d="M360,237 L435,237" fill="none" stroke="#536f85" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M735,237 L810,237" fill="none" stroke="#536f85" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1110,237 L1185,237" fill="none" stroke="#536f85" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="60" y="445" width="725" height="375" rx="20" fill="#ffffff" stroke="#d7e2eb" stroke-width="1.5"/>
<text x="80" y="482" font-size="23" font-weight="700" fill="#52677a" text-anchor="start">检测消费者：一个被选中的 Worker</text>
<rect x="835" y="445" width="705" height="375" rx="20" fill="#ffffff" stroke="#d7e2eb" stroke-width="1.5"/>
<text x="855" y="482" font-size="23" font-weight="700" fill="#52677a" text-anchor="start">输出消费者：main</text>
<rect x="80" y="515" width="210" height="170" rx="14" fill="#edf4ff" stroke="#5585bd" stroke-width="1.6"/>
<text x="101" y="553" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">RGA 读 S</text>
<text x="101" y="590" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">ROI / IM_SYNC</text>
<text x="101" y="619" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">写私有 RGB I</text>
<text x="101" y="648" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">完成后放弃 S 租约</text>
<rect x="325" y="515" width="205" height="170" rx="14" fill="#eaf6f0" stroke="#40876b" stroke-width="1.6"/>
<text x="346" y="553" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">I · RGB</text>
<text x="346" y="590" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">按模型配置</text>
<text x="346" y="619" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">每 Worker 1 块</text>
<text x="346" y="648" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">独立帧租约</text>
<rect x="565" y="515" width="200" height="170" rx="14" fill="#edf4ff" stroke="#5585bd" stroke-width="1.6"/>
<text x="586" y="553" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">RKNN 读 I</text>
<text x="586" y="590" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">绑定 → 推理</text>
<text x="586" y="619" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">取输出 → 后处理</text>
<text x="586" y="648" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">保持 I 租约</text>
<path d="M290,600 L325,600" fill="none" stroke="#536f85" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M530,600 L565,600" fill="none" stroke="#536f85" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="855" y="515" width="205" height="170" rx="14" fill="#edf4ff" stroke="#5585bd" stroke-width="1.6"/>
<text x="876" y="553" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">RGA 读 S</text>
<text x="876" y="590" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">ROI / IM_SYNC</text>
<text x="876" y="619" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">写独立 BGR B</text>
<text x="876" y="648" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">完成后放弃 S 租约</text>
<rect x="1095" y="515" width="200" height="170" rx="14" fill="#eaf6f0" stroke="#40876b" stroke-width="1.6"/>
<text x="1116" y="553" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">B · BGR</text>
<text x="1116" y="590" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">Renderer 双槽</text>
<text x="1116" y="619" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">CPU RW START</text>
<text x="1116" y="648" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">画框 / 预览</text>
<rect x="1330" y="515" width="190" height="170" rx="14" fill="#edf4ff" stroke="#5585bd" stroke-width="1.6"/>
<text x="1351" y="553" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">finish()</text>
<text x="1351" y="590" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">CPU RW END</text>
<text x="1351" y="619" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">再允许 RGA 读 B</text>
<text x="1351" y="648" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">Mat 不异步外借</text>
<path d="M1060,600 L1095,600" fill="none" stroke="#536f85" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1295,600 L1330,600" fill="none" stroke="#536f85" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1360,310 L1360,380 L185,380 L185,515" fill="none" stroke="#536f85" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1360,380 L957,380 L957,515" fill="none" stroke="#536f85" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="540" y="365" font-size="20" font-weight="700" fill="#152b40" text-anchor="start">先估计防抖并固定 ROI，再向两路共享同一 S 的描述与 owner</text>
<text x="85" y="735" font-size="20" font-weight="700" fill="#152b40" text-anchor="start">I 复用：设备已完成，且本帧所有 owner 释放。</text>
<text x="85" y="773" font-size="19" font-weight="400" fill="#152b40" text-anchor="start">注册可长期保留 allocation；注册存在不表示本帧在途。</text>
<text x="855" y="735" font-size="20" font-weight="700" fill="#152b40" text-anchor="start">B 复用：CPU finish 后；如转编码，还须 RGA 读取完成。</text>
<text x="855" y="773" font-size="19" font-weight="400" fill="#152b40" text-anchor="start">借用 cv::Mat 不拥有 DMA 分配，也不等待显示扫描结束。</text>
<rect x="60" y="865" width="1480" height="110" rx="14" fill="#f1f4f7" stroke="#9eabb8" stroke-width="1.6"/>
<text x="81" y="903" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">S 源槽复用门禁</text>
<text x="81" y="940" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">推理侧 RGA 已读完 + 输出侧 RGA 已读完 + 生产者 / 等待槽 / 消费者的外部 owner 全部释放；NPU 可仍在读取独立 I。</text>
<rect x="60" y="1040" width="435" height="180" rx="14" fill="#f2edfc" stroke="#8a6ab1" stroke-width="1.6"/>
<text x="81" y="1078" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">可选：main 内编码转换</text>
<text x="81" y="1115" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">B 的 CPU RW END 已完成</text>
<text x="81" y="1144" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">同步 RGA 读取 B → 写编码 NV12 E</text>
<text x="81" y="1173" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">转换完成后交给编码等待槽</text>
<rect x="565" y="1040" width="410" height="180" rx="14" fill="#eaf6f0" stroke="#40876b" stroke-width="1.6"/>
<text x="586" y="1078" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">E · 编码 NV12 池 ×3</text>
<text x="586" y="1115" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">独立 FrameLease；800×600</text>
<text x="586" y="1144" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">NV12 stride 800×608</text>
<text x="586" y="1173" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">MPP 注册与帧占用分开管理</text>
<rect x="1045" y="1040" width="495" height="180" rx="14" fill="#f2edfc" stroke="#8a6ab1" stroke-width="1.6"/>
<text x="1066" y="1078" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">MPP 编码 Worker</text>
<text x="1066" y="1115" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">持有 E → 编码 → 收齐输出到 EOI</text>
<text x="1066" y="1144" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">外层 StreamFrame 继续持有到本轮写出结束</text>
<text x="1066" y="1173" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">所有帧租约释放后 E 才可复用</text>
<path d="M495,1130 L565,1130" fill="none" stroke="#536f85" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M975,1130 L1045,1130" fill="none" stroke="#536f85" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="56" y="1355" font-size="19" font-weight="400" fill="#52677a" text-anchor="start">allocation 保证分配存活；owner 保证当前帧不被覆盖；Cache Sync 管理 CPU 一致性；设备完成条件独立判断。</text>
<text x="56" y="1383" font-size="19" font-weight="400" fill="#52677a" text-anchor="start">采集无应用层压缩包复制；仍有图像转换、CPU 防抖/画框与码流读取，不声明端到端零拷贝。</text>
</svg>