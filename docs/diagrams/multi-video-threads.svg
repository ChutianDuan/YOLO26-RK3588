<text x="301" y="913" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">4 份独立 Channel 状态：仍由领取任务的 Worker 更新</text>
<text x="301" y="950" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">按 task.channel 路由；本路 mutex 保护 Tracker / 水位 / history ≤ 64 / events ≤ 64</text>
<text x="301" y="979" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">不存在单独 Track 线程；同一路的处理通过 busy 限制串行</text>
<text x="301" y="1008" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">某路下一帧可以由不同 Worker 执行，目标身份使用 channel_id:track_id</text>
