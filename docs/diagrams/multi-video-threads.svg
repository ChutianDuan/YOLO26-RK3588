<text x="56" y="1465" font-size="19" font-weight="400" fill="#52677a" text-anchor="start">4 解码 + 3 Worker + 4 输出 + 1 main = 12 个应用线程；没有独立日志 / 录像线程，SDK 内部线程另计。</text>
<text x="56" y="1493" font-size="19" font-weight="400" fill="#52677a" text-anchor="start">只开 1 路时最多 1 个任务在途；该策略与 camera_live 的单路多 Worker 并发不同。</text>
