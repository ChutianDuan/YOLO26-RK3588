<text x="301" y="448" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">FairScheduler：数据结构，不是额外线程</text>
<text x="301" y="485" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">mutex + condition_variable；轮询各通道，每路 pending ≤ 1 / busy ≤ 1</text>
<text x="301" y="514" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">成功派发后推进游标；Worker 在锁外执行；完成本路更新与事件发布后 complete(channel)</text>
