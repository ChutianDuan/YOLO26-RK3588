<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1700" viewBox="0 0 1640 1700" role="img" aria-labelledby="title desc">
<title id="title">03 · 停止、异常与资源清理</title><desc id="desc">camera_live 当前控制流 · finish 保留待消费项；close / cancel 舍弃等待项；已在途任务继续受租约保护</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9Z" fill="#536f85"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans CJK JP",sans-serif;fill:#152b40}.small{font-size:19px;fill:#52677a}.body{font-size:21px}.label{font-size:18px;fill:#52677a}.title{font-size:26px;font-weight:700}</style>
<rect width="1640" height="1700" fill="#fbfcfe"/>
<rect x="0" y="0" width="1640" height="9" fill="#2e6f85"/>
<text x="56" y="64" font-size="35" font-weight="700" fill="#152b40" text-anchor="start">03 · 停止、异常与资源清理</text>
<text x="56" y="105" font-size="20" font-weight="400" fill="#52677a" text-anchor="start">camera_live 当前控制流 · finish 保留待消费项；close / cancel 舍弃等待项；已在途任务继续受租约保护</text>
<rect x="60" y="155" width="675" height="165" rx="14" fill="#eaf6f0" stroke="#40876b" stroke-width="1.6"/>
<text x="81" y="193" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">正常源结束 EOF</text>
<text x="81" y="230" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">capture：packets.finish()</text>
<text x="81" y="259" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">decode：消费到结束 → infer / output.finish()</text>
<text x="81" y="288" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">main 消费完输出槽后退出输出循环</text>
<rect x="865" y="155" width="675" height="165" rx="14" fill="#fff0ef" stroke="#bf635a" stroke-width="1.6"/>
<text x="886" y="193" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">主动停止 / 可处理的应用异常</text>
<text x="886" y="230" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">SIGINT / 帧数限制 / 关闭窗口 / 队列超时等</text>
<text x="886" y="259" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">异常先记录 error 并 stopNewWork()</text>
<text x="886" y="288" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">信号或正常限制由 main 跳出输出循环</text>
<rect x="300" y="390" width="1000" height="125" rx="14" fill="#fff6e6" stroke="#bc8a32" stroke-width="1.6"/>
<text x="321" y="428" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">① stopNewWork：停止新增工作</text>
<text x="321" y="465" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">atomic stop = true；packets / infer_frames / output_frames.close()</text>
<text x="321" y="494" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">丢弃尚未开始的等待项，notify_all 唤醒消费者；不撤销设备在途任务</text>
<path d="M400,320 L400,350 L800,350 L800,390" fill="none" stroke="#536f85" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1200,320 L1200,350 L800,350" fill="none" stroke="#536f85" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="300" y="580" width="1000" height="150" rx="14" fill="#edf4ff" stroke="#5585bd" stroke-width="1.6"/>
<text x="321" y="618" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">② join 固定线程，结束结果消费</text>
<text x="321" y="655" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">join capture → join decode → join 全部 Worker</text>
<text x="321" y="684" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">最后一个 Worker 退出时 results.finish()；join 后再次幂等 finish()</text>
<text x="321" y="713" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">track 消费已有结果或因异常结束，再 join track</text>
<path d="M800,515 L800,580" fill="none" stroke="#536f85" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="300" y="795" width="1000" height="125" rx="14" fill="#edf4ff" stroke="#5585bd" stroke-width="1.6"/>
<text x="321" y="833" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">③ 输出与可选编码收尾</text>
<text x="321" y="870" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">防抖与渲染 finish 后，stream.stop() 关闭编码等待槽并 join</text>
<text x="321" y="899" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">编码线程退出时清理其 MPP；关闭预览，采集最终统计</text>
<path d="M800,730 L800,795" fill="none" stroke="#536f85" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="300" y="985" width="1000" height="125" rx="14" fill="#edf4ff" stroke="#5585bd" stroke-width="1.6"/>
<text x="321" y="1023" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">④ Writer 收尾</text>
<text x="321" y="1060" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">正常：写 summary → finish 队列 → join writer</text>
<text x="321" y="1089" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">错误：cancelPending → finish / join；失败时最终 JSONL summary 可能缺失</text>
<path d="M800,920 L800,985" fill="none" stroke="#536f85" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="300" y="1175" width="1000" height="190" rx="14" fill="#eaf6f0" stroke="#40876b" stroke-width="1.6"/>
<text x="321" y="1213" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">⑤ runLive 返回与局部对象 RAII 清理</text>
<text x="321" y="1250" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">MPP decoder：reset / destroy → 释放其池持有；外部租约可延长分配存活</text>
<text x="321" y="1279" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">RKNN engine：必要时 wait → 撤注册 → 销毁 Context → 释放 active_input</text>
<text x="321" y="1308" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">某块 DMA 最后所有者消失：撤 RGA handle → munmap → close FD</text>
<text x="321" y="1337" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">源对象属于调用方：随后析构，STREAMOFF 成功后再 unmap / close</text>
<path d="M800,1110 L800,1175" fill="none" stroke="#536f85" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="60" y="1430" font-size="19" font-weight="700" fill="#52677a" text-anchor="start">以下是独立安全失败分支，可在任一硬件执行或清理位置触发；不进入普通释放路径。</text>
<rect x="60" y="1450" width="740" height="120" rx="14" fill="#fff0ef" stroke="#bf635a" stroke-width="1.6"/>
<text x="81" y="1488" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">硬件无法确认完成：独立失败分支</text>
<text x="81" y="1525" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">相关 RGA / RKNN / MPP 解码路径终止进程</text>
<text x="81" y="1554" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">不继续按“设备已停止”假设回收在途缓冲</text>
<rect x="850" y="1450" width="690" height="120" rx="14" fill="#f2edfc" stroke="#8a6ab1" stroke-width="1.6"/>
<text x="871" y="1488" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">编码 reset / destroy 无法确认停止</text>
<text x="871" y="1525" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">禁用推流；隔离固定资源到进程退出</text>
<text x="871" y="1554" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">不复用不确定的 E；与普通释放路径分开</text>
<text x="56" y="1635" font-size="19" font-weight="400" fill="#52677a" text-anchor="start">EOF 后 main 仍进入统一 close；不能保证最后一个待检测帧必然被检测。Writer 与编码异常的状态分别检查。</text>
<text x="56" y="1663" font-size="19" font-weight="400" fill="#52677a" text-anchor="start">250 ms 只是结果 / 日志入队等待预算；fwrite、fflush、join 与真实设备故障没有统一硬退出时限。</text>
</svg>