<text x="781" y="630" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">私有 Context/RGB/预处理器</text>
<text x="781" y="659" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">RGA 同步 → RKNN 阻塞</text>
<text x="781" y="688" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">YOLO 后处理 · 核掩码 4</text>
