<text x="931" y="230" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">独占 MPP MJPEG；输出 NV12 Surface 池 S（8 槽）</text>
<text x="931" y="259" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">防抖分析并固定 ROI，再向两路共享帧</text>
