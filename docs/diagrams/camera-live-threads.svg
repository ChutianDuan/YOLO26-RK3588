<text x="81" y="230" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">USB MJPEG 800×600 → 包池 P（8 槽）</text>
<text x="81" y="259" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">换入空闲 DMA-BUF 后 QBUF</text>
