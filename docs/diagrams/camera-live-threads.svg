<text x="441" y="863" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">results · FIFO</text>
<text x="441" y="900" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">容量 3；保留已完成结果</text>
<text x="441" y="929" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">持续满 250 ms 报错</text>
<rect x="820" y="825" width="310" height="150" rx="14" fill="#edf4ff" stroke="#5585bd" stroke-width="1.6"/>
<text x="841" y="863" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">④ track 校正线程</text>
<text x="841" y="900" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">唯一可变 ByteTracker</text>
<text x="841" y="929" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">已完成批次排序</text>
<text x="841" y="958" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">水位拒绝迟到结果</text>
<rect x="1190" y="825" width="340" height="150" rx="14" fill="#eaf6f0" stroke="#40876b" stroke-width="1.6"/>
<text x="1211" y="863" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">snapshots · 快照历史</text>
<text x="1211" y="900" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">最多 64 份</text>
<text x="1211" y="929" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">snapshot_mutex 下复制</text>
<text x="1211" y="958" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">main 在锁外预测</text>
<path d="M740,887 L820,887" fill="none" stroke="#536f85" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1130,897 L1190,897" fill="none" stroke="#536f85" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1370,825 L1370,730" fill="none" stroke="#536f85" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<text x="1390" y="790" font-size="18" font-weight="400" fill="#52677a" text-anchor="start">读取合适快照</text>
<rect x="420" y="1080" width="320" height="125" rx="14" fill="#fff6e6" stroke="#bc8a32" stroke-width="1.6"/>
<text x="441" y="1118" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">JSONL · FIFO</text>
<text x="441" y="1155" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">容量 64；不持图像租约</text>
<text x="441" y="1184" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">持续满 250 ms 报错</text>
<rect x="820" y="1080" width="310" height="125" rx="14" fill="#edf4ff" stroke="#5585bd" stroke-width="1.6"/>
<text x="841" y="1118" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">⑥ writer 写入线程</text>
<text x="841" y="1155" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">顺序写帧、检测、资源记录</text>
<text x="841" y="1184" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">另写 metadata / summary</text>
<path d="M975,975 L975,1025 L580,1025 L580,1080" fill="none" stroke="#536f85" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1530,640 L1590,640 L1590,1010 L580,1010 L580,1080" fill="none" stroke="#536f85" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M740,1142 L820,1142" fill="none" stroke="#536f85" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1190" y="1080" width="340" height="205" rx="14" fill="#f2edfc" stroke="#8a6ab1" stroke-width="1.6"/>
<text x="1211" y="1118" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">⑦ 可选推流分支</text>
<text x="1211" y="1155" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">main 先 RGA：BGR → NV12 E</text>
<text x="1211" y="1184" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">E 池 3 槽 / latest 等待项 1</text>
<text x="1211" y="1213" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">encoder：MPP → 本机 UDP TS</text>
<text x="1211" y="1242" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">FFmpeg → MediaMTX → 观看端</text>
<path d="M1530,690 L1560,690 L1560,1050 L1360,1050 L1360,1080" fill="none" stroke="#536f85" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<text x="60" y="1300" font-size="21" font-weight="700" fill="#152b40" text-anchor="start">线程数：1 capture + 1 decode + 3 Worker + 1 track + 1 main + 1 writer = 8；推流开启后为 9。</text>
<text x="60" y="1345" font-size="19" fill="#52677a">decode 内防抖：两槽 320×240 灰度 + CPU LK/EMA；检测与输出使用同一帧 ROI。</text>
<text x="56" y="1385" font-size="19" font-weight="400" fill="#52677a" text-anchor="start">每 Worker 的 engine mutex 独立；latest/FIFO 用 mutex + 条件变量；停止标志和跨线程计数用 atomic。</text>
<text x="56" y="1413" font-size="19" font-weight="400" fill="#52677a" text-anchor="start">线程数不含 OpenCV / FFmpeg / SDK 内部线程；RTSP / WebRTC 在此处是输出，非输入。</text>
</svg>