<text x="1181" y="593" font-size="25" font-weight="700" fill="#152b40" text-anchor="start">⑤ main 调用线程</text>
<text x="1181" y="630" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">RGA 转 BGR → 预测 → 画框</text>
<text x="1181" y="659" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">可选预览；finish 结束 CPU 访问</text>
<text x="1181" y="688" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">不等待当前帧检测完成</text>
