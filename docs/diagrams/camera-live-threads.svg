<text x="571" y="259" font-size="20" font-weight="400" fill="#152b40" text-anchor="start">替换尚未开始的旧包</text>
<rect x="910" y="155" width="620" height="135" rx="14" fill="#edf4ff" stroke="#5585bd" stroke-width="1.6"/>
